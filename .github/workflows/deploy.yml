name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🧹 Prepare Hostinger Host
        id: host-config
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          CLEAN_SERVER="${RAW_SERVER#ftp://}"
          CLEAN_SERVER="${CLEAN_SERVER#ftps://}"
          CLEAN_SERVER="${CLEAN_SERVER%/}"
          if [ -z "$CLEAN_SERVER" ]; then CLEAN_SERVER="145.79.58.1"; fi
          echo "host=$CLEAN_SERVER" >> $GITHUB_OUTPUT

      - name: 🚀 Sync Files to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.host-config.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/ezgif-frame-*.jpg
            **/api/data/leads.db*
            **/api/data/leads.json
          timeout: 180000
          dangerous-clean-slate: false
